<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- onresize, onkeypress, onscroll-->
<body oncontextmenu="return false">
    <button onclick="hello()">Single Click</button>
    <button ondblclick="hello()">Double Click</button>
    <button oncontextmenu="hello()">Right Click</button>
    <button onmouseenter="hello()">On Mouse Enter</button>
    <button onmouseout="hello()">On Mouse Out</button>
    <button o="hello()">On Mouse Out</button>
    <script>
        function hello(){
            alert("Welcome");
        }
    </script>
</body>
</html>
