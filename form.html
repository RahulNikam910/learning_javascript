<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <main>
    <section class="mt-3">
      <div class="container">
        <div class="row">
          <div class="col-md-6">
            <form onsubmit="return validate()">
              <div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Name</label>
                  <input type="text" class="form-control" id="exampleFormControlInput1" id="name" name="name" placeholder="Enter Full Name">
                  <span class="text-danger" id="nameError"></span>
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Date of Birth</label>
                  <input type="date" class="form-control" id="exampleFormControlInput1" 
                    placeholder="Enter Date of Birth">
                    <span class="text-danger" id="nameError"></span>
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Email</label>
                  <input type="email" class="form-control" id="exampleFormControlInput1" id="email" email="email" placeholder="name@example.com">
                </div>
                <span class="text-danger" id="emailError"></span>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Phone Number</label>
                  <input type="number" class="form-control" id="exampleFormControlInput1" id="phone" phone="phone"
                    placeholder="Enter Phone Number">
                    <span class="text-danger" id="phoneError"></span>
                </div> 
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Password</label>
                  <input type="password" class="form-control" id="exampleFormControlInput1" id="password" password="password"
                    placeholder="Enter Password">
                    <span class="text-danger" id="passwordError"></span>
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Confirm Password</label>
                  <input type="password " class="form-control" id="exampleFormControlInput1" id="confirmpassword" confirmpassword="confirmpassword"
                    placeholder="Enter Password">
                    <span class="text-danger" id="confirmpasswordError"></span>
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlTextarea1" class="form-label">Enter Address</label>
                  <textarea class="form-control" id="exampleFormControlTextarea1" id="address" address="address" rows="3"></textarea>
                  <span class="text-danger" id="addressError"></span>
                </div>
                <div class="mb-3">
                  <button type="submit" class="btn btn-success">Submit Form</button>
                </div>
              </div>
            </form>
          </div>
          <div class="col-md-6">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d120985.46388477407!2d73.6324239972656!3d18.628254600000005!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2b90907083469%3A0xf15f12e419146ae4!2sBrew%20nation!5e0!3m2!1sen!2sin!4v1785995900585!5m2!1sen!2sin"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    function validate(){
        // Get form values
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmpassword = document.getElementById("confirmpassword").value.trim();
        const address = document.getElementById("address").value.trim();
        //Error Span
        const nameError = document.getElementById("nameError").value.trim();
        const emailError = document.getElementById("emailError").value.trim();
        const phoneError = document.getElementById("phoneError").value.trim();
        const passwordError = document.getElementById("passwordError").value.trim();
        const confirmpasswordError = document.getElementById("confirmpasswordError").value.trim();
        const addressError = document.getElementById("addressError").value.trim();
    }

  </script>
</body>
</html>
